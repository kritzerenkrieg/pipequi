name: release

# A tag push (v*) builds pipequi_<version>_all.deb and publishes it in a GitHub release for that tag.
# To build one again by hand: Actions > release > Run workflow, with the tag name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the app
        run: python3 -m py_compile pipequi.py

      - name: Build .deb
        run: |
          ./build-deb.sh "${TAG#v}"
          dpkg-deb --info pipequi_*_all.deb
          dpkg-deb --contents pipequi_*_all.deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pipequi_*_all.deb --clobber
          else
            gh release create "$TAG" pipequi_*_all.deb --title "pipequi $TAG" --notes \
              "Install on Debian or Ubuntu with \`sudo apt install ./pipequi_${TAG#v}_all.deb\`, then open pipequi and press Set up."
          fi
